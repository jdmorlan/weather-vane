name: Vane
options:
  bundleIdPrefix: jdm-solutions
  deploymentTarget:
    macOS: "26.0"
    tvOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  WeatherKit:
    path: Packages/WeatherKit

targets:
  Vane:
    type: application
    platform: macOS
    templates: [Stamped]
    sources:
      # Everything but the iPhone's root, which is UIKit-idiom code with no
      # meaning on a Mac. See `PhoneRoot`.
      - path: Weather
        excludes:
          - "Phone/**"
    dependencies:
      - package: WeatherKit
    settings:
      base:
        PRODUCT_NAME: Vane
        # RENAMED, and the old comment here argued against exactly this. It said
        # UserDefaults is keyed by bundle id — token, station, home, facing — so
        # a rename silently resets a configured app to first-run for a cosmetic
        # win. That was correct when the win WAS cosmetic and nothing carried the
        # setup. Two things changed: these ids are about to be permanent (App
        # Store Connect does not let you rename or reuse one, so the last moment
        # to fix `.weather` — a generic word, for the flagship app, that does
        # not even say Vane — is before TestFlight), and `SettingsSync` now
        # carries station and home between devices. What the rename actually
        # costs is `homeFacing` and `hasSeenSetup`, which deliberately do not
        # sync — and `AppSettings.migrateLegacyDefaults` brings those across
        # once. The archive was never at risk: it is reached through the app
        # group, which is not keyed by bundle id.
        PRODUCT_BUNDLE_IDENTIFIER: jdmorlan.vane.mac
        DEVELOPMENT_TEAM: CG68B3UD28
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Weather/Weather.entitlements
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_CFBundleDisplayName: Vane
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.weather
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1"
        # Answered in the build so App Store Connect stops asking on every
        # upload. Vane's only cryptography is HTTPS to WeatherFlow, the NWS and
        # Open-Meteo, which is exempt — there is no encryption of its own.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        # THE FLOOR, NOT THE BUILD NUMBER. `Scripts/stamp-build-number.sh`
        # overwrites CFBundleVersion in the built Info.plist on every build; this
        # only has to exist so there is a key for it to overwrite, and so a build
        # with the script somehow skipped still produces a valid bundle.
        CURRENT_PROJECT_VERSION: "1"

  # The SAME sources as the Mac app, deliberately — not a VaneTV-style
  # reimplementation. VaneTV has its own views because a ten-foot deck driven by
  # a remote is a different app that shares a domain; an iPad running the sidebar
  # app is this app on a slightly smaller screen with a finger for a pointer.
  # `NavigationSplitView` already collapses correctly on its own, so what was
  # actually needed was a map that speaks UIKit and four fenced modifiers. See
  # `PlatformBridge`.
  VaneiOS:
    type: application
    platform: iOS
    templates: [Stamped]
    sources:
      - Weather
    dependencies:
      - package: WeatherKit
    settings:
      base:
        PRODUCT_NAME: Vane
        # Distinct from the Mac app's. Nothing migrates between them — the
        # archive on an iPad is filled from WeatherFlow, not copied off a Mac —
        # so the reason to keep the Mac id frozen does not apply here.
        PRODUCT_BUNDLE_IDENTIFIER: jdmorlan.vane.ios
        DEVELOPMENT_TEAM: CG68B3UD28
        CODE_SIGN_ENTITLEMENTS: Weather/VaneiOS.entitlements
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Vane
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.weather
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # ALL FOUR, INCLUDING UPSIDE-DOWN, and it is not optional. An iPad app
        # that does not set UIRequiresFullScreen supports multitasking, and
        # multitasking requires every orientation — a Split View pane cannot be
        # told the app refuses to be one way up. Declaring three fails upload
        # validation outright rather than merely warning.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        # The phone is portrait only: a scroll of cards held in one hand. The
        # multitasking rule above does not reach it — an iPhone app has no Split
        # View pane to refuse.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1"
        # Answered in the build so App Store Connect stops asking on every
        # upload. Vane's only cryptography is HTTPS to WeatherFlow, the NWS and
        # Open-Meteo, which is exempt — there is no encryption of its own.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        # THE FLOOR, NOT THE BUILD NUMBER. `Scripts/stamp-build-number.sh`
        # overwrites CFBundleVersion in the built Info.plist on every build; this
        # only has to exist so there is a key for it to overwrite, and so a build
        # with the script somehow skipped still produces a valid bundle.
        CURRENT_PROJECT_VERSION: "1"
        # UNIVERSAL, which is what the `.ios` id was kept open for. The phone is
        # a different app in every way you can see — two tabs, no archive — but
        # the same binary, because a second target would need a second id and so
        # a second App Store listing. `WeatherApp` picks the root by idiom; see
        # `PhoneRoot`.
        TARGETED_DEVICE_FAMILY: "1,2"
        # NO APP-GROUP ENTITLEMENT, on purpose. `AppGroup.resolve` falls back to
        # Application Support when the container is nil, which on iOS is already
        # the app's own sandboxed directory — the right home. A group is only
        # worth claiming once something else (a widget) needs to read the archive,
        # and claiming one that isn't in the profile fails the signature.

  VaneTV:
    type: application
    platform: tvOS
    templates: [Stamped]
    sources:
      - VaneTV
      # The Mac's field renderer, shared rather than copied: the TV's radar
      # draws through the same two-slot dissolve. It has no platform code.
      - Weather/Views/FieldRenderer.swift
      - Weather/Views/SweepTrail.swift
      # The Forecast page's figure and its storm outlooks, for the same reason:
      # one three-day chart, drawn at ten-foot size on the TV.
      - Weather/Views/ThreeDayTimeline.swift
      - Weather/Views/StormOutlookModel.swift
      # The outlook areas as ONE overlay, as on the Mac. One MapKit polygon per
      # shape took a seven-day rain total — thousands of rings — to 1.5 GB.
      - Weather/Views/MapShapes.swift
    dependencies:
      - package: WeatherKit
    settings:
      base:
        PRODUCT_NAME: Vane
        PRODUCT_BUNDLE_IDENTIFIER: jdmorlan.vane.tv
        DEVELOPMENT_TEAM: CG68B3UD28
        CODE_SIGN_ENTITLEMENTS: VaneTV/VaneTV.entitlements
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        MARKETING_VERSION: "0.1"
        # Answered in the build so App Store Connect stops asking on every
        # upload. Vane's only cryptography is HTTPS to WeatherFlow, the NWS and
        # Open-Meteo, which is exempt — there is no encryption of its own.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        # THE FLOOR, NOT THE BUILD NUMBER. `Scripts/stamp-build-number.sh`
        # overwrites CFBundleVersion in the built Info.plist on every build; this
        # only has to exist so there is a key for it to overwrite, and so a build
        # with the script somehow skipped still produces a valid bundle.
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "3"

# THE BUILD NUMBER, ONCE, FOR ALL THREE APPS.
#
# A template rather than the same six lines pasted into each target: they must
# not drift, because the one way this fails silently is two apps disagreeing
# about what a build number means while both upload happily.
targetTemplates:
  Stamped:
    postBuildScripts:
      # LAST PHASE, WHICH IS STILL BEFORE CODE SIGNING. Xcode signs after every
      # build phase has run, so the Info.plist is stamped and then signed, never
      # the other way round.
      #
      # A SCRIPT PHASE RATHER THAN A VALUE IN THIS FILE, which was the obvious
      # thing and is the wrong one: a number baked in at `xcodegen generate` time
      # is only as fresh as the last time somebody remembered to run it, and the
      # moment it matters — hitting Archive in Xcode before a TestFlight upload —
      # is exactly the moment nobody is thinking about a YAML file. Worked out at
      # build time, it cannot be stale.
      - script: '"$SRCROOT/Scripts/stamp-build-number.sh"'
        name: Stamp build number
        # There is no input for Xcode to compare against — the answer depends on
        # the clock. Without this it runs once and is then skipped all day.
        basedOnDependencyAnalysis: false

# Declared rather than left to Xcode. Xcode invents a scheme the first time you
# open a target and stores it under xcuserdata, which `xcodegen generate` then
# wipes — so the Mac scheme kept vanishing after every project regeneration
# while the tvOS one happened to survive. Named here, both are generated every
# time and shared, which also means CI and a fresh clone see the same two.
schemes:
  Vane:
    build:
      targets:
        Vane: all
    run:
      config: Debug
    archive:
      config: Release
  VaneiOS:
    build:
      targets:
        VaneiOS: all
    run:
      config: Debug
    archive:
      config: Release

  VaneTV:
    build:
      targets:
        VaneTV: all
    run:
      config: Debug
    archive:
      config: Release
