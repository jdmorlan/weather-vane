name: Vane
options:
  bundleIdPrefix: jdm-solutions
  deploymentTarget:
    macOS: "26.0"
    tvOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  WeatherKit:
    path: Packages/WeatherKit

targets:
  Vane:
    type: application
    platform: macOS
    templates: [Stamped]
    sources:
      # Everything but the iPhone's root, which is UIKit-idiom code with no
      # meaning on a Mac. See `PhoneRoot`.
      - path: Weather
        excludes:
          - "Phone/**"
    dependencies:
      - package: WeatherKit
    settings:
      base:
        PRODUCT_NAME: Vane
        # THE iOS APP'S ID, since the Mac app was sandboxed (see
        # Weather.entitlements). App Store Connect adds a platform to an existing
        # record only when the build carries the same bundle id, so this is what
        # makes the Mac part of the one Vane — with the iPhone, iPad and TV, in
        # one TestFlight — rather than a second listing that would need a name
        # other than Vane. It was `jdmorlan.vane.mac` while the Mac shipped
        # notarized outside the store; that id never reached App Store Connect,
        # so moving off it cost nothing there.
        #
        # What it costs on the Mac: a sandboxed app keeps its settings in its own
        # container, so the first launch starts fresh. `SettingsSync` brings the
        # station and home back from iCloud and `SetupSheet` says so; which way
        # the house faces is asked once. The archive is untouched — it is reached
        # through the app group, which is keyed by neither.
        PRODUCT_BUNDLE_IDENTIFIER: jdmorlan.vane.ios
        DEVELOPMENT_TEAM: CG68B3UD28
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Weather/Weather.entitlements
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_CFBundleDisplayName: Vane
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.weather
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1"
        # Answered in the build so App Store Connect stops asking on every
        # upload. Vane's only cryptography is HTTPS to WeatherFlow, the NWS and
        # Open-Meteo, which is exempt — there is no encryption of its own.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        # THE FLOOR, NOT THE BUILD NUMBER. `Scripts/stamp-build-number.sh`
        # overwrites CFBundleVersion in the built Info.plist on every build; this
        # only has to exist so there is a key for it to overwrite, and so a build
        # with the script somehow skipped still produces a valid bundle.
        CURRENT_PROJECT_VERSION: "1"
        # Pinned so that renaming the Debug product below does not rename the
        # Swift module with it (`Vane Dev` would become `Vane_Dev`).
        PRODUCT_MODULE_NAME: Vane
      # DEBUG IS A SEPARATE APP: VANE DEV. A device decides two apps are the same
      # app by bundle id, so while Debug and Release shared one, running from
      # Xcode replaced the installed Vane and installing Vane replaced the one you
      # were developing. With `.dev` on the end they sit side by side on every
      # device — the real one from TestFlight or /Applications, the working copy
      # from Xcode — told apart by name and by a grey icon with an orange DEV tag
      # (`Scripts/make-dev-icons.py`, which derives it from this icon).
      #
      # WHAT THE TWO SHARE, ON PURPOSE. The iCloud settings store is named by
      # a literal in the entitlements, not by bundle id, so Vane Dev finds the
      # station and home already set. On the Mac the archive is reached through
      # the app group, also not keyed by bundle id, so both read one past — and
      # `ArchiveFileLock` keeps the two from writing the same file at once.
      # Which way the house faces does not sync, so Vane Dev asks for it once.
      #
      # Release is untouched, so TestFlight and App Store ids stay what they are.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: jdmorlan.vane.ios.dev
          # The Mac shows PRODUCT_NAME in the menu bar and Activity Monitor, not
          # just the display name — both have to say Dev.
          PRODUCT_NAME: Vane Dev
          INFOPLIST_KEY_CFBundleDisplayName: Vane Dev
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev

  # The SAME sources as the Mac app, deliberately — not a VaneTV-style
  # reimplementation. VaneTV has its own views because a ten-foot deck driven by
  # a remote is a different app that shares a domain; an iPad running the sidebar
  # app is this app on a slightly smaller screen with a finger for a pointer.
  # `NavigationSplitView` already collapses correctly on its own, so what was
  # actually needed was a map that speaks UIKit and four fenced modifiers. See
  # `PlatformBridge`.
  VaneiOS:
    type: application
    platform: iOS
    templates: [Stamped]
    sources:
      - Weather
    dependencies:
      - package: WeatherKit
    settings:
      base:
        PRODUCT_NAME: Vane
        # Distinct from the Mac app's. Nothing migrates between them — the
        # archive on an iPad is filled from WeatherFlow, not copied off a Mac —
        # so the reason to keep the Mac id frozen does not apply here.
        # The Mac app and VaneTV carry this same id, deliberately — see VaneTV.
        PRODUCT_BUNDLE_IDENTIFIER: jdmorlan.vane.ios
        DEVELOPMENT_TEAM: CG68B3UD28
        CODE_SIGN_ENTITLEMENTS: Weather/VaneiOS.entitlements
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Vane
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.weather
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # ALL FOUR, INCLUDING UPSIDE-DOWN, and it is not optional. An iPad app
        # that does not set UIRequiresFullScreen supports multitasking, and
        # multitasking requires every orientation — a Split View pane cannot be
        # told the app refuses to be one way up. Declaring three fails upload
        # validation outright rather than merely warning.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        # The phone is portrait only: a scroll of cards held in one hand. The
        # multitasking rule above does not reach it — an iPhone app has no Split
        # View pane to refuse.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1"
        # Answered in the build so App Store Connect stops asking on every
        # upload. Vane's only cryptography is HTTPS to WeatherFlow, the NWS and
        # Open-Meteo, which is exempt — there is no encryption of its own.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        # THE FLOOR, NOT THE BUILD NUMBER. `Scripts/stamp-build-number.sh`
        # overwrites CFBundleVersion in the built Info.plist on every build; this
        # only has to exist so there is a key for it to overwrite, and so a build
        # with the script somehow skipped still produces a valid bundle.
        CURRENT_PROJECT_VERSION: "1"
        # UNIVERSAL, which is what the `.ios` id was kept open for. The phone is
        # a different app in every way you can see — two tabs, no archive — but
        # the same binary, because a second target would need a second id and so
        # a second App Store listing. `WeatherApp` picks the root by idiom; see
        # `PhoneRoot`.
        TARGETED_DEVICE_FAMILY: "1,2"
        # NO APP-GROUP ENTITLEMENT, on purpose. `AppGroup.resolve` falls back to
        # Application Support when the container is nil, which on iOS is already
        # the app's own sandboxed directory — the right home. A group is only
        # worth claiming once something else (a widget) needs to read the archive,
        # and claiming one that isn't in the profile fails the signature.
      # Vane Dev — see the Mac target. On iOS each app has its own sandbox, so
      # Vane Dev fills its own archive rather than sharing the real app's.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: jdmorlan.vane.ios.dev
          INFOPLIST_KEY_CFBundleDisplayName: Vane Dev
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev

  VaneTV:
    type: application
    platform: tvOS
    templates: [Stamped]
    sources:
      - VaneTV
      # The Mac's field renderer, shared rather than copied: the TV's radar
      # draws through the same two-slot dissolve. It has no platform code.
      - Weather/Views/FieldRenderer.swift
      - Weather/Views/SweepTrail.swift
      # The Forecast page's figure and its storm outlooks, for the same reason:
      # one three-day chart, drawn at ten-foot size on the TV.
      - Weather/Views/ThreeDayTimeline.swift
      - Weather/Views/StormOutlookModel.swift
      # The outlook areas as ONE overlay, as on the Mac. One MapKit polygon per
      # shape took a seven-day rain total — thousands of rings — to 1.5 GB.
      - Weather/Views/MapShapes.swift
      # The forecasters' feeds and live check. The list is drawn by the TV's
      # own `VideosTab`; only the model is shared.
      - Weather/Views/ForecasterModel.swift
    dependencies:
      - package: WeatherKit
    settings:
      base:
        PRODUCT_NAME: Vane
        # THE iOS APP'S ID, NOT ITS OWN, and that is what makes the TV part of
        # the same App Store record. App Store Connect adds a platform to an
        # existing app only when the new platform's build carries the same bundle
        # id (universal purchase); a different id is a different app, which needs
        # its own listing and its own name — and "Vane" is already taken, by
        # this very record. With one id, iPhone, iPad and TV are one Vane, one
        # TestFlight, one listing. The two binaries still differ completely:
        # the id says which app, the platform says which build.
        #
        # Changed from `jdmorlan.vane.tv` before any TV build was uploaded, the
        # last moment it was free. Nothing was lost on the TV: the setup gate is
        # `hasHome`, and the home point returns by `SettingsSync`.
        PRODUCT_BUNDLE_IDENTIFIER: jdmorlan.vane.ios
        DEVELOPMENT_TEAM: CG68B3UD28
        CODE_SIGN_ENTITLEMENTS: VaneTV/VaneTV.entitlements
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        MARKETING_VERSION: "0.1"
        # Answered in the build so App Store Connect stops asking on every
        # upload. Vane's only cryptography is HTTPS to WeatherFlow, the NWS and
        # Open-Meteo, which is exempt — there is no encryption of its own.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        # THE FLOOR, NOT THE BUILD NUMBER. `Scripts/stamp-build-number.sh`
        # overwrites CFBundleVersion in the built Info.plist on every build; this
        # only has to exist so there is a key for it to overwrite, and so a build
        # with the script somehow skipped still produces a valid bundle.
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "3"
      # Vane Dev — see the Mac target. Shares the iOS Dev id for the same reason
      # Release shares the iOS id.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: jdmorlan.vane.ios.dev
          INFOPLIST_KEY_CFBundleDisplayName: Vane Dev
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev

# THE BUILD NUMBER, ONCE, FOR ALL THREE APPS.
#
# A template rather than the same six lines pasted into each target: they must
# not drift, because the one way this fails silently is two apps disagreeing
# about what a build number means while both upload happily.
targetTemplates:
  Stamped:
    postBuildScripts:
      # LAST PHASE, WHICH IS STILL BEFORE CODE SIGNING. Xcode signs after every
      # build phase has run, so the Info.plist is stamped and then signed, never
      # the other way round.
      #
      # A SCRIPT PHASE RATHER THAN A VALUE IN THIS FILE, which was the obvious
      # thing and is the wrong one: a number baked in at `xcodegen generate` time
      # is only as fresh as the last time somebody remembered to run it, and the
      # moment it matters — hitting Archive in Xcode before a TestFlight upload —
      # is exactly the moment nobody is thinking about a YAML file. Worked out at
      # build time, it cannot be stale.
      - script: '"$SRCROOT/Scripts/stamp-build-number.sh"'
        name: Stamp build number
        # There is no input for Xcode to compare against — the answer depends on
        # the clock. Without this it runs once and is then skipped all day.
        basedOnDependencyAnalysis: false

# Declared rather than left to Xcode. Xcode invents a scheme the first time you
# open a target and stores it under xcuserdata, which `xcodegen generate` then
# wipes — so the Mac scheme kept vanishing after every project regeneration
# while the tvOS one happened to survive. Named here, both are generated every
# time and shared, which also means CI and a fresh clone see the same two.
schemes:
  Vane:
    build:
      targets:
        Vane: all
    run:
      config: Debug
    archive:
      config: Release
  VaneiOS:
    build:
      targets:
        VaneiOS: all
    run:
      config: Debug
    archive:
      config: Release

  VaneTV:
    build:
      targets:
        VaneTV: all
    run:
      config: Debug
    archive:
      config: Release
